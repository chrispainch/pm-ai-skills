version: 1

# Relative to the consuming project's root. Change this value to relocate every
# persistent skill output without editing individual skills.
output_root: product

# `{initiative_id}`, `{research_id}`, `{domain_id}`, `{year}`, `{quarter}`, and
# `{date}` are supplied by the task when they occur in a path.
outputs:
  product-direction:
    primary: strategy/direction/product-direction.md
  market-research:
    primary: strategy/market-research/{research_id}/brief.md
    evidence_ledger: strategy/market-research/{research_id}/evidence-ledger.md
  wardley-strategy:
    primary: strategy/wardley/{domain_id}/map.yaml
    review: strategy/wardley/{domain_id}/review.md
  portfolio-prioritization:
    primary: strategy/portfolio/{year}-{quarter}.md
  problem-framing:
    primary: initiatives/{initiative_id}/framing.md
  product-discovery:
    primary: initiatives/{initiative_id}/discovery.md
    evidence: initiatives/{initiative_id}/evidence/{source_id}.md
  solution-shaping:
    primary: initiatives/{initiative_id}/solution.md
  breadboarding:
    primary: initiatives/{initiative_id}/flow.md
  ascii-ui-exploration:
    primary: initiatives/{initiative_id}/ui-exploration.md
    persistence: optional
  delivery-specification:
    primary: initiatives/{initiative_id}/delivery-specification.md
  product-launching:
    primary: initiatives/{initiative_id}/launch.md
  product-learning:
    primary: initiatives/{initiative_id}/learning/{date}-outcome-review.md
    persistence: append-only
