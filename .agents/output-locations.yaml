version: 1

# Relative to the consuming project's root. Change this value to relocate every
# persistent skill output without editing individual skills.
output_root: /

# `{initiative_id}`, `{research_id}`, `{domain_id}`, `{year}`, `{quarter}`, 
# `{problem}`, `{version}` and `{date}` are supplied by the task when they occur in a path.
outputs:
  product-direction:
    primary: strategy/product-direction.md
  market-research:
    primary: context/{research_id}/brief.md
    evidence_ledger: context/{research_id}/evidence-ledger.md
  wardley-strategy:
    primary: strategy/wardley/{domain_id}/map.yaml
    review: strategy/wardley/{domain_id}/review.md
  portfolio-prioritization:
    primary: strategy/portfolio/{year}-{quarter}.md
  problem-framing:
    primary: shaping/{initiative_id}/framing-{problem}-{version}.md
  solution-shaping:
    primary: shaping/{initiative_id}/solution-{version}.md
  breadboarding:
    primary: shaping/{initiative_id}/breadboarding-flow.md
  ascii-ui-exploration:
    primary: shaping/{initiative_id}/ui-exploration.md
    persistence: optional
  product-launching:
    primary: launching/{initiative_id}/product_marketing_brief.md
